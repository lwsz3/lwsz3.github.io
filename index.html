<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解树建 - 数据科学家</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局变量与重置 */
        :root {
            --primary: #00f5ff;
            --secondary: #7e22ce;
            --accent: #ff00c8;
            --dark: #0a0a1a;
            --darker: #050510;
            --light: #e0f8ff;
            --text: #ffffff;
            --text-secondary: #a0a0c0;
            --card-bg: rgba(10, 15, 35, 0.7);
            --glow: 0 0 15px rgba(0, 245, 255, 0.5);
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--darker);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(126, 34, 206, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 20%),
                linear-gradient(to bottom, var(--darker), var(--dark));
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%2300f5ff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.5;
            z-index: -1;
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 245, 255, 0.2);
            transition: all 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            text-shadow: var(--glow);
        }

        .logo i {
            margin-right: 10px;
            font-size: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav li {
            margin: 0 15px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        nav a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: var(--primary);
            transition: width 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a:hover:after {
            width: 100%;
        }

        .mobile-menu {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        /* 英雄区域 */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            padding-top: 80px;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 20px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(0, 245, 255, 0.8), 0 0 30px rgba(0, 245, 255, 0.6);
            }
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-secondary);
        }

        .btn {
            display: inline-block;
            background: var(--gradient);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s;
        }

        .btn:hover:before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 245, 255, 0.5);
        }

        /* 粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(20px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }

        /* 内容区域 */
        section {
            padding: 80px 0;
            position: relative;
        }

        section:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--primary);
            text-align: center;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient);
            border-radius: 3px;
        }

        /* 关于我 */
        .about-content {
            display: flex;
            align-items: center;
            gap: 40px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .avatar {
            flex: 0 0 300px;
            text-align: center;
            position: relative;
        }

        .avatar img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            box-shadow: var(--glow);
            transition: transform 0.5s;
            position: relative;
            z-index: 2;
        }

        .avatar:before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: var(--gradient);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.7;
            filter: blur(15px);
        }

        .avatar img:hover {
            transform: scale(1.05);
        }

        .about-text {
            flex: 1;
        }

        .about-text p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .social-links {
            display: flex;
            margin-top: 20px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(0, 245, 255, 0.1);
            color: var(--primary);
            border-radius: 50%;
            margin-right: 15px;
            transition: all 0.3s;
            border: 1px solid rgba(0, 245, 255, 0.3);
        }

        .social-links a:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--glow);
        }

        /* 技能区域 */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .skill-category {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .skill-category:hover {
            transform: translateY(-10px);
        }

        .skill-category h3 {
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            font-size: 1.3rem;
        }

        .skill-category h3 i {
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .skill-bar {
            margin-bottom: 20px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .skill-progress {
            height: 8px;
            background: rgba(0, 245, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .skill-progress:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .skill-progress div {
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            width: 0;
            transition: width 1.5s ease-in-out;
            position: relative;
            z-index: 2;
        }

        /* 学习计划 */
        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
        }

        .timeline:before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gradient);
            transform: translateX(-50%);
            box-shadow: var(--glow);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 50px;
            width: 50%;
            padding: 0;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            padding-right: 50px;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            padding-left: 50px;
        }

        .timeline-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .timeline-content:hover {
            transform: translateY(-5px);
        }

        .timeline-content h3 {
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .timeline-item:before {
            content: '';
            position: absolute;
            top: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: var(--glow);
            z-index: 2;
        }

        .timeline-item:nth-child(odd):before {
            right: -10px;
        }

        .timeline-item:nth-child(even):before {
            left: -10px;
        }

        /* 网站链接 */
        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .website-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .website-card:hover {
            transform: translateY(-10px);
        }

        .website-icon {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient);
            color: white;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .website-icon:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .website-card:hover .website-icon:before {
            transform: translateX(100%);
        }

        .website-info {
            padding: 25px;
        }

        .website-info h3 {
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .website-info p {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .website-info a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s;
        }

        .website-info a i {
            margin-left: 5px;
            transition: transform 0.3s;
        }

        .website-info a:hover {
            color: var(--accent);
        }

        .website-info a:hover i {
            transform: translateX(5px);
        }

        /* 联系表单 */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-info {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .contact-item i {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2rem;
            box-shadow: var(--glow);
        }

        .contact-item div h3 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        .contact-item div p {
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(0, 10, 20, 0.5);
            color: var(--text);
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s;
        }

        button:hover:before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 245, 255, 0.5);
        }

        /* 页脚 */
        footer {
            background: rgba(5, 5, 16, 0.9);
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(0, 245, 255, 0.2);
        }

        .social-links-footer {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .social-links-footer a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(0, 245, 255, 0.1);
            color: var(--primary);
            border-radius: 50%;
            margin: 0 10px;
            transition: all 0.3s;
            border: 1px solid rgba(0, 245, 255, 0.3);
        }

        .social-links-footer a:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--glow);
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .about-content {
                flex-direction: column;
                text-align: center;
            }
            
            .contact-container {
                grid-template-columns: 1fr;
            }
            
            .timeline:before {
                left: 20px;
            }
            
            .timeline-item {
                width: calc(100% - 40px);
                left: 40px !important;
                padding: 0 !important;
            }
            
            .timeline-item:before {
                left: -10px !important;
            }
            
            .timeline-item:nth-child(even) {
                left: 40px;
            }
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                text-align: center;
            }
            
            nav ul {
                flex-direction: column;
                margin-top: 15px;
            }
            
            nav li {
                margin: 10px 0;
            }
            
            .mobile-menu {
                display: block;
                position: absolute;
                top: 20px;
